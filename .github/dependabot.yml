# Dependabot: bağımlılık güncelleme bildirimleri (haftalık).
# Otomasyon zorunlu değildi (MASTER_PROMPT §3.4) ancak ağsız ilkeyi
# değiştirmez: yalnızca PR açar; lisans değişikliği THIRD_PARTY dosyalarıyla
# review gerektirir (bkz. pull_request_template.md Lisans bölümü).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
