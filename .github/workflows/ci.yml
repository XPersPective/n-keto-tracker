name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyze_format_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies (l10n üretimi dahil)
        run: flutter pub get
      - name: Offline kanıtı (INTERNET izni + yasaklı paket taraması)
        run: |
          chmod +x tool/check_offline.sh
          bash tool/check_offline.sh
      - name: Format kontrolü
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  build_release_apk:
    runs-on: ubuntu-latest
    needs: analyze_format_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build release APK
        run: flutter build apk --release
      - name: APK boyutu raporu
        run: |
          echo "## APK boyutu" >> "$GITHUB_STEP_SUMMARY"
          echo "- release: $(du -m build/app/outputs/flutter-apk/app-release.apk | cut -f1) MB" >> "$GITHUB_STEP_SUMMARY"
