schema_version: 4

architecture:
  mode: single          # single: current.md/target.md | domains: current/<d>.md, target/<d>.md

git:
  history_mode: preserve # preserve | squash | rewrite-prone | unknown
  commit: auto          # auto: commit each checkpoint | ask: prepare the commit, ask the user
  push: every-task          # every-task | milestone | session-end | manual

commands:               # exact commands; boot prints them so nobody rediscovers them
  test: "flutter test"
  lint: "flutter analyze --fatal-infos && dart format --output=none --set-exit-if-changed lib test tool"
  build: "flutter build apk --release"
  offline: "bash tool/check_offline.sh"
